[project]
name = "wtdtk"
version = "0.1.0"
description = "Implementation of Wellcome Tech Dev naming conventions for tissue samples."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

[build-system]
requires = ["uv-build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "prek>=0.5.3",
    "pydoclint>=0.9.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "rust-just>=1.58.0",
]
doc = [
    "pdoc>=16.0.0",
]

[project.scripts]
validate_sections = "wtdtk.section_table:validate_sections_csv_cli"

[tool.pydoclint]
arg-type-hints-in-docstring = false
allow-init-docstring = true

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true

[tool.ruff]
lint.external = [
    "DOC", # pydoclint
    "D",   # pydocstyle
]
